<!DOCTYPE html>
<html>
  <body>
    <!--
      This file exists solely so Netlify can detect the contact form at build time.
      Next.js renders JSX client-side, so Netlify cannot see the form in the React
      component. This static HTML gives Netlify the form definition it needs.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="firstName" />
      <input name="lastName" />
      <input name="email" type="email" />
      <input name="subject" />
      <input name="organisation" />
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" />
    </form>
  </body>
</html>
